version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: scout_planner
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/migration.sql:/docker-entrypoint-initdb.d/02-migration.sql

  web:
    build: .
    ports:
      - "8000:8000"
      - "5678:5678"
    environment:
      DATABASE_URL: postgresql://scout:scout123@db:5432/scout_planner
    depends_on:
      - db
    volumes:
      - .:/app
    command: python main.py

volumes:
  postgres_data: