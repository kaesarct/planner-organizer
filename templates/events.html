{% extends "base.html" %}

{% block title %}Eventi - Scout Planner{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📅 Eventi</h2>
    {% if permissions.get('event_create_edit', False) %}
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#eventModal" onclick="resetEventForm()">+ Nuovo Evento</button>
    {% endif %}
</div>

<!-- Tabs per Lista e Calendario -->
<ul class="nav nav-tabs" id="eventTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="list-tab" data-bs-toggle="tab" data-bs-target="#list" type="button">📋 Lista</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="calendar-tab" data-bs-toggle="tab" data-bs-target="#calendar" type="button">📅 Calendario</button>
    </li>
</ul>

<div class="tab-content" id="eventTabsContent">
    <!-- Lista Eventi -->
    <div class="tab-pane fade show active" id="list" role="tabpanel">
        <div class="row mt-3" id="events-container">
            <!-- Eventi caricati dinamicamente -->
        </div>
    </div>
    
    <!-- Calendario -->
    <div class="tab-pane fade" id="calendar" role="tabpanel">
        <div id="calendar-container" class="mt-3">
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <button class="btn btn-outline-secondary" onclick="changePeriod(-1)">‹ Precedente</button>
                                <h5 id="calendar-title" class="mb-0"></h5>
                                <button class="btn btn-outline-secondary" onclick="changePeriod(1)">Successivo ›</button>
                            </div>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-outline-success" id="monthViewBtn" onclick="setCalendarView('month')">📅 Mese</button>
                                <button type="button" class="btn btn-outline-success" id="weekViewBtn" onclick="setCalendarView('week')">📋 Settimana</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="calendar-grid"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Nuovo/Modifica Evento -->
<div class="modal fade" id="eventModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="eventModalTitle">Nuovo Evento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="eventForm">
                    <input type="hidden" id="eventId" name="event_id">
                    <div class="mb-3">
                        <label class="form-label">Titolo</label>
                        <input type="text" class="form-control" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrizione</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select class="form-control" name="type" required>
                            <option value="riunione">Riunione</option>
                            <option value="uscita">Uscita</option>
                            <option value="campo">Campo</option>
                            <option value="consiglio">Consiglio</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Luogo</label>
                        <input type="text" class="form-control" id="locationSearch" placeholder="Cerca un luogo..." autocomplete="off">
                        <input type="hidden" name="location" id="locationName">
                        <input type="hidden" name="location_lat" id="locationLat">
                        <input type="hidden" name="location_lng" id="locationLng">
                        <div id="locationResults" class="list-group mt-2" style="display: none; max-height: 200px; overflow-y: auto;"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data Inizio</label>
                        <input type="datetime-local" class="form-control" name="start_date" id="start_date" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data Fine</label>
                        <input type="datetime-local" class="form-control" name="end_date" id="end_date" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                <button type="button" class="btn btn-success" id="saveEventBtn" onclick="saveEvent()">Salva</button>
            </div>
        </div>
    </div>
</div>

<script>
window.userRole = '{{ user.role }}';
window.canEditEvents = {{ 'true' if permissions.get('event_create_edit', False) else 'false' }};
let currentDate = new Date();
let eventsData = [];
let calendarView = 'month'; // 'month' o 'week'

// Ricerca luogo con Nominatim (OpenStreetMap)
let searchTimeout;
const locationSearch = document.getElementById('locationSearch');
const locationResults = document.getElementById('locationResults');

locationSearch.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    const query = this.value.trim();
    
    if (query.length < 3) {
        locationResults.style.display = 'none';
        return;
    }
    
    searchTimeout = setTimeout(async () => {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&addressdetails=1&extratags=1`);
            const results = await response.json();
            
            if (results.length > 0) {
                locationResults.innerHTML = results.map(result => `
                    <button type="button" class="list-group-item list-group-item-action" 
                            onclick="selectLocation('${result.display_name.replace(/'/g, "\\'").replace(/"/g, '&quot;')}', ${result.lat}, ${result.lon})">
                        <i class="fas fa-map-marker-alt"></i> ${result.display_name}
                    </button>
                `).join('');
                locationResults.style.display = 'block';
            } else {
                locationResults.innerHTML = '<div class="list-group-item">Nessun risultato trovato</div>';
                locationResults.style.display = 'block';
            }
        } catch (error) {
            console.error('Errore ricerca luogo:', error);
        }
    }, 500);
});

function selectLocation(name, lat, lng) {
    document.getElementById('locationSearch').value = name;
    document.getElementById('locationName').value = name;
    document.getElementById('locationLat').value = lat;
    document.getElementById('locationLng').value = lng;
    locationResults.style.display = 'none';
}

// Gestione date nel form
document.addEventListener('DOMContentLoaded', function() {
    const startDateInput = document.getElementById('start_date');
    const endDateInput = document.getElementById('end_date');
    
    // Imposta data minima a oggi
    const now = new Date();
    const minDateTime = now.toISOString().slice(0, 16);
    startDateInput.min = minDateTime;
    endDateInput.min = minDateTime;
    
    // Quando cambia data inizio, aggiorna data fine (+1 ora)
    startDateInput.addEventListener('change', function() {
        if (this.value) {
            const startDate = new Date(this.value);
            const endDate = new Date(startDate.getTime() + 60 * 60 * 1000); // +1 ora
            endDateInput.value = endDate.toISOString().slice(0, 16);
            endDateInput.min = this.value; // Data fine non può essere prima di inizio
        }
    });
    
    loadEvents();
    renderCalendar();
});

async function loadEvents() {
    try {
        const response = await fetch('/api/events');
        if (!response.ok) {
            console.error('Errore caricamento eventi:', response.status);
            return;
        }
        eventsData = await response.json();
        console.log('Eventi caricati:', eventsData.length);
    
    // Separa eventi futuri e passati
    const now = new Date();
    const futureEvents = eventsData.filter(event => new Date(event.start_date) >= now)
        .sort((a, b) => new Date(a.start_date) - new Date(b.start_date));
    const pastEvents = eventsData.filter(event => new Date(event.start_date) < now)
        .sort((a, b) => new Date(b.start_date) - new Date(a.start_date));
    
    const container = document.getElementById('events-container');
    
    let html = '';
    
    // Eventi futuri
    if (futureEvents.length > 0) {
        html += '<div class="col-12 mb-3"><h4 class="text-success">📅 Prossimi Eventi</h4></div>';
        html += futureEvents.map(event => `
            <div class="col-md-6 mb-3">
                <div class="card border-success" style="cursor: pointer;" onclick="showEventDetails(${event.id})">
                    <div class="card-body">
                        <h5 class="card-title">${event.title}</h5>
                        <p class="card-text">
                            <span class="badge bg-primary">${event.type}</span><br>
                            <small class="text-muted">
                                ${formatDate(event.start_date)} - ${formatDate(event.end_date)}
                            </small>
                        </p>
                        ${event.location ? `<p class="card-text"><i class="fas fa-map-marker-alt"></i> ${event.location}</p>` : ''}
                        <div class="mt-2">
                            <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); addToGoogleCalendar(${event.id})">
                                <i class="fab fa-google"></i> Google Calendar
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation(); downloadICS(${event.id})">
                                <i class="fas fa-download"></i> iCal
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }
    
    // Eventi passati (collassabili)
    if (pastEvents.length > 0) {
        html += `
            <div class="col-12 mb-3">
                <div class="card">
                    <div class="card-header" style="cursor: pointer;" onclick="togglePastEvents()">
                        <h5 class="mb-0 text-muted">
                            📁 Eventi Passati (${pastEvents.length})
                            <span id="past-events-icon" class="float-end">▼</span>
                        </h5>
                    </div>
                    <div id="past-events-content" class="collapse">
                        <div class="card-body">
                            <div class="row">
                                ${pastEvents.map(event => `
                                    <div class="col-md-6 mb-3">
                                        <div class="card bg-light text-muted">
                                            <div class="card-body">
                                                <h6 class="card-title text-muted">${event.title}</h6>
                                                <p class="card-text">
                                                    <span class="badge bg-secondary">${event.type}</span><br>
                                                    <small>
                                                        ${formatDate(event.start_date)} - ${formatDate(event.end_date)}
                                                    </small>
                                                </p>
                                                ${event.location ? `<p class="card-text"><small><i class="fas fa-map-marker-alt"></i> ${event.location}</small></p>` : ''}
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    if (html === '') {
        container.innerHTML = '<div class="col-12"><div class="alert alert-info">Nessun evento presente. Crea il primo evento!</div></div>';
    } else {
        container.innerHTML = html;
    }
    
    // Aggiorna calendario
    renderCalendar();
    } catch (error) {
        console.error('Errore loadEvents:', error);
        document.getElementById('events-container').innerHTML = '<div class="col-12"><div class="alert alert-danger">Errore caricamento eventi</div></div>';
    }
}

async function saveEvent() {
    const form = document.getElementById('eventForm');
    const formData = new FormData(form);
    const data = Object.fromEntries(formData);
    const eventId = document.getElementById('eventId').value;
    
    data.group_id = 1;
    
    // Aggiungi coordinate se presenti
    const lat = document.getElementById('locationLat').value;
    const lng = document.getElementById('locationLng').value;
    if (lat && lng) {
        data.location_lat = parseFloat(lat);
        data.location_lng = parseFloat(lng);
    }
    
    // Validazione date
    const startDate = new Date(data.start_date);
    const endDate = new Date(data.end_date);
    
    if (endDate <= startDate) {
        alert('La data di fine deve essere successiva alla data di inizio!');
        return;
    }
    
    // Update o Create
    const url = eventId ? `/api/events/${eventId}` : '/api/events';
    const method = eventId ? 'PUT' : 'POST';
    
    await fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    
    const modal = bootstrap.Modal.getInstance(document.getElementById('eventModal'));
    if (modal) modal.hide();
    resetEventForm();
    await loadEvents();
}

function resetEventForm() {
    const form = document.getElementById('eventForm');
    form.reset();
    document.getElementById('eventId').value = '';
    document.getElementById('locationSearch').value = '';
    document.getElementById('locationName').value = '';
    document.getElementById('locationLat').value = '';
    document.getElementById('locationLng').value = '';
    document.getElementById('eventModalTitle').textContent = 'Nuovo Evento';
    document.getElementById('saveEventBtn').textContent = 'Salva';
}

function editEvent(eventId) {
    const event = eventsData.find(e => e.id === eventId);
    if (!event) return;
    
    // Chiudi modale dettagli
    const detailsModal = bootstrap.Modal.getInstance(document.getElementById('eventDetailsModal'));
    if (detailsModal) detailsModal.hide();
    
    // Popola form
    document.getElementById('eventId').value = event.id;
    document.querySelector('[name="title"]').value = event.title;
    document.querySelector('[name="description"]').value = event.description || '';
    document.querySelector('[name="type"]').value = event.type;
    document.querySelector('[name="location"]').value = event.location || '';
    document.getElementById('locationSearch').value = event.location || '';
    document.getElementById('locationName').value = event.location || '';
    document.getElementById('locationLat').value = event.location_lat || '';
    document.getElementById('locationLng').value = event.location_lng || '';
    
    // Formatta date per input datetime-local
    const startDate = new Date(event.start_date);
    const endDate = new Date(event.end_date);
    document.getElementById('start_date').value = startDate.toISOString().slice(0, 16);
    document.getElementById('end_date').value = endDate.toISOString().slice(0, 16);
    
    // Aggiorna titolo modale
    document.getElementById('eventModalTitle').textContent = 'Modifica Evento';
    document.getElementById('saveEventBtn').textContent = 'Aggiorna';
    
    // Apri modale
    const modal = new bootstrap.Modal(document.getElementById('eventModal'));
    modal.show();
}

function formatDate(dateString) {
    return new Date(dateString).toLocaleDateString('it-IT', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

// Calendario
function renderCalendar() {
    if (calendarView === 'month') {
        renderMonthView();
    } else {
        renderWeekView();
    }
    
    // Aggiorna pulsanti attivi
    document.getElementById('monthViewBtn').classList.toggle('active', calendarView === 'month');
    document.getElementById('weekViewBtn').classList.toggle('active', calendarView === 'week');
}

function renderMonthView() {
    const monthNames = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno',
        'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
    
    document.getElementById('calendar-title').textContent = 
        `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
    
    const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    const startDate = new Date(firstDay);
    startDate.setDate(startDate.getDate() - firstDay.getDay());
    
    let calendarHTML = '<div class="calendar-grid">';
    calendarHTML += '<div class="calendar-header">';
    ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'].forEach(day => {
        calendarHTML += `<div class="calendar-day-header">${day}</div>`;
    });
    calendarHTML += '</div>';
    
    for (let week = 0; week < 6; week++) {
        calendarHTML += '<div class="calendar-week">';
        for (let day = 0; day < 7; day++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + (week * 7) + day);
            
            const isCurrentMonth = date.getMonth() === currentDate.getMonth();
            const dayEvents = eventsData.filter(event => {
                const eventDate = new Date(event.start_date);
                return eventDate.toDateString() === date.toDateString();
            });
            
            calendarHTML += `
                <div class="calendar-day ${isCurrentMonth ? '' : 'other-month'}">
                    <div class="day-number">${date.getDate()}</div>
                    <div class="day-events">
                        ${dayEvents.map(event => 
                            `<div class="event-dot" title="${event.title}" style="background-color: ${getEventColor(event.type)}"></div>`
                        ).join('')}
                    </div>
                </div>
            `;
        }
        calendarHTML += '</div>';
    }
    calendarHTML += '</div>';
    
    document.getElementById('calendar-grid').innerHTML = calendarHTML;
}

function renderWeekView() {
    const weekStart = new Date(currentDate);
    weekStart.setDate(currentDate.getDate() - currentDate.getDay());
    
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    
    document.getElementById('calendar-title').textContent = 
        `${weekStart.getDate()}/${weekStart.getMonth() + 1} - ${weekEnd.getDate()}/${weekEnd.getMonth() + 1}/${weekEnd.getFullYear()}`;
    
    let calendarHTML = '<div class="week-view">';
    calendarHTML += '<div class="week-header">';
    ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'].forEach(day => {
        calendarHTML += `<div class="week-day-header">${day}</div>`;
    });
    calendarHTML += '</div>';
    
    calendarHTML += '<div class="week-days">';
    for (let i = 0; i < 7; i++) {
        const date = new Date(weekStart);
        date.setDate(weekStart.getDate() + i);
        
        const dayEvents = eventsData.filter(event => {
            const eventDate = new Date(event.start_date);
            return eventDate.toDateString() === date.toDateString();
        });
        
        calendarHTML += `
            <div class="week-day">
                <div class="week-day-number">${date.getDate()}</div>
                <div class="week-day-events">
                    ${dayEvents.map(event => 
                        `<div class="week-event" style="background-color: ${getEventColor(event.type)}" title="${event.title}">
                            <div class="event-time">${new Date(event.start_date).toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'})}</div>
                            <div class="event-title">${event.title}</div>
                        </div>`
                    ).join('')}
                </div>
            </div>
        `;
    }
    calendarHTML += '</div></div>';
    
    document.getElementById('calendar-grid').innerHTML = calendarHTML;
}

function changePeriod(direction) {
    if (calendarView === 'month') {
        currentDate.setMonth(currentDate.getMonth() + direction);
    } else {
        currentDate.setDate(currentDate.getDate() + (direction * 7));
    }
    renderCalendar();
}

function setCalendarView(view) {
    calendarView = view;
    renderCalendar();
}

function getEventColor(type) {
    const colors = {
        'riunione': '#007bff',
        'uscita': '#28a745',
        'campo': '#ffc107',
        'consiglio': '#dc3545'
    };
    return colors[type] || '#6c757d';
}

function togglePastEvents() {
    const content = document.getElementById('past-events-content');
    const icon = document.getElementById('past-events-icon');
    
    if (content.classList.contains('show')) {
        content.classList.remove('show');
        icon.textContent = '▼';
    } else {
        content.classList.add('show');
        icon.textContent = '▲';
    }
}

function showEventDetails(eventId) {
    const event = eventsData.find(e => e.id === eventId);
    if (!event) return;
    
    let modalContent = `
        <div class="modal fade" id="eventDetailsModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">${event.title}</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Tipo:</strong> <span class="badge bg-primary">${event.type}</span></p>
                        <p><strong>Inizio:</strong> ${formatDate(event.start_date)}</p>
                        <p><strong>Fine:</strong> ${formatDate(event.end_date)}</p>
                        ${event.description ? `<p><strong>Descrizione:</strong> ${event.description}</p>` : ''}
                        ${event.location ? `<p><strong>Luogo:</strong> ${event.location}</p>` : ''}
                        ${event.location_lat && event.location_lng ? `
                            <div id="map" style="height: 300px; width: 100%; margin-top: 15px;"></div>
                            <a href="https://www.google.com/maps?q=${event.location_lat},${event.location_lng}" target="_blank" class="btn btn-sm btn-success mt-2">
                                <i class="fas fa-map-marked-alt"></i> Apri in Google Maps
                            </a>
                        ` : ''}
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
                        ${window.canEditEvents ? `<button type="button" class="btn btn-primary" onclick="editEvent(${eventId})">✏️ Modifica Evento</button>` : ''}
                    </div>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalContent);
    const modal = new bootstrap.Modal(document.getElementById('eventDetailsModal'));
    modal.show();
    
    document.getElementById('eventDetailsModal').addEventListener('hidden.bs.modal', function() {
        this.remove();
    });
    
    if (event.location_lat && event.location_lng) {
        setTimeout(() => {
            const mapDiv = document.getElementById('map');
            if (mapDiv) {
                mapDiv.innerHTML = `<iframe width="100%" height="300" frameborder="0" style="border:0" 
                    src="https://www.openstreetmap.org/export/embed.html?bbox=${event.location_lng-0.01},${event.location_lat-0.01},${event.location_lng+0.01},${event.location_lat+0.01}&layer=mapnik&marker=${event.location_lat},${event.location_lng}" 
                    allowfullscreen></iframe>`;
            }
        }, 100);
    }
}

function addToGoogleCalendar(eventId) {
    const event = eventsData.find(e => e.id === eventId);
    if (!event) return;
    
    const startDate = new Date(event.start_date).toISOString().replace(/-|:|\.\d+/g, '');
    const endDate = new Date(event.end_date).toISOString().replace(/-|:|\.\d+/g, '');
    
    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(event.title)}&dates=${startDate}/${endDate}&details=${encodeURIComponent(event.description || '')}&location=${encodeURIComponent(event.location || '')}`;
    
    window.open(url, '_blank');
}

function downloadICS(eventId) {
    const event = eventsData.find(e => e.id === eventId);
    if (!event) return;
    
    const startDate = new Date(event.start_date).toISOString().replace(/-|:|\.\d+/g, '');
    const endDate = new Date(event.end_date).toISOString().replace(/-|:|\.\d+/g, '');
    
    const icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Scout Planner//Event//IT',
        'BEGIN:VEVENT',
        `UID:${event.id}@scoutplanner`,
        `DTSTAMP:${new Date().toISOString().replace(/-|:|\.\d+/g, '')}`,
        `DTSTART:${startDate}`,
        `DTEND:${endDate}`,
        `SUMMARY:${event.title}`,
        event.description ? `DESCRIPTION:${event.description.replace(/\n/g, '\\n')}` : '',
        event.location ? `LOCATION:${event.location}` : '',
        'END:VEVENT',
        'END:VCALENDAR'
    ].filter(line => line).join('\r\n');
    
    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${event.title.replace(/[^a-z0-9]/gi, '_')}.ics`;
    link.click();
}
</script>
{% endblock %}
