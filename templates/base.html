<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scout Planner{% endblock %}</title>
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="/">🏕️ Scout Planner</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/dashboard" id="nav-dashboard">Dashboard</a>
                <a class="nav-link" href="/events" id="nav-events">Eventi</a>
                <a class="nav-link" href="/tasks" id="nav-tasks">Task</a>
                {% if user and user.role == 'admin' %}
                    <a class="nav-link" href="/admin">🔒 Admin</a>
                {% endif %}
            </div>
            <div class="navbar-nav">
                {% if user %}
                    <span class="navbar-text me-3">{{ user.name }} ({{ user.role }})</span>
                    <form method="post" action="/auth/logout" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">Esci</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="/login">Accedi</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
