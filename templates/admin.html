{% extends "base.html" %}

{% block title %}Admin - Scout Planner{% endblock %}

{% block content %}
<div id="login-section">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>🔒 Accesso Admin</h5>
                </div>
                <div class="card-body">
                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label class="form-label">Password Admin</label>
                            <input type="password" class="form-control" id="adminPassword" placeholder="Inserisci password" required>
                        </div>
                        <button type="submit" class="btn btn-success">Accedi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="admin-panel" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🛠️ Pannello Admin</h2>
        <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
    </div>
    
    <!-- Tabs Admin -->
    <ul class="nav nav-tabs" id="adminTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="events-admin-tab" data-bs-toggle="tab" data-bs-target="#events-admin" type="button">📅 Eventi</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tasks-admin-tab" data-bs-toggle="tab" data-bs-target="#tasks-admin" type="button">✅ Task</button>
        </li>
    </ul>
    
    <div class="tab-content" id="adminTabsContent">
        <!-- Tab Eventi -->
        <div class="tab-pane fade show active" id="events-admin" role="tabpanel">
            <div class="row mt-3" id="admin-events-container">
                <!-- Eventi con controlli admin caricati dinamicamente -->
            </div>
        </div>
        
        <!-- Tab Task -->
        <div class="tab-pane fade" id="tasks-admin" role="tabpanel">
            <div class="mt-3" id="admin-tasks-container">
                <!-- Task con controlli admin caricati dinamicamente -->
            </div>
        </div>
    </div>
</div>

<!-- Modal Modifica Evento -->
<div class="modal fade" id="editEventModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Modifica Evento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editEventForm">
                    <input type="hidden" id="editEventId">
                    <div class="mb-3">
                        <label class="form-label">Titolo</label>
                        <input type="text" class="form-control" id="editTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrizione</label>
                        <textarea class="form-control" id="editDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select class="form-control" id="editType" required>
                            <option value="riunione">Riunione</option>
                            <option value="uscita">Uscita</option>
                            <option value="campo">Campo</option>
                            <option value="consiglio">Consiglio</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Luogo</label>
                        <input type="text" class="form-control" id="editLocation">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data Inizio</label>
                        <input type="datetime-local" class="form-control" id="editStartDate" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data Fine</label>
                        <input type="datetime-local" class="form-control" id="editEndDate" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                <button type="button" class="btn btn-success" onclick="saveEditEvent()">Salva Modifiche</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Modifica Task -->
<div class="modal fade" id="editTaskModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Modifica Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editTaskForm">
                    <input type="hidden" id="editTaskId">
                    <div class="mb-3">
                        <label class="form-label">Titolo</label>
                        <input type="text" class="form-control" id="editTaskTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrizione</label>
                        <textarea class="form-control" id="editTaskDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Priorità</label>
                        <select class="form-control" id="editTaskPriority" required>
                            <option value="low">Bassa</option>
                            <option value="medium">Media</option>
                            <option value="high">Alta</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-control" id="editTaskStatus" required>
                            <option value="pending">In Attesa</option>
                            <option value="in_progress">In Corso</option>
                            <option value="completed">Completato</option>
                            <option value="cancelled">Annullato</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Scadenza</label>
                        <input type="datetime-local" class="form-control" id="editTaskDueDate">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                <button type="button" class="btn btn-success" onclick="saveEditTask()">Salva Modifiche</button>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const password = document.getElementById('adminPassword').value;
    
    if (password === 'claudiofaro') {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        sessionStorage.setItem('adminAuth', 'true');
        loadAdminEvents();
        loadAdminTasks();
    } else {
        alert('Password errata!');
        document.getElementById('adminPassword').value = '';
    }
});

// Controlla se già autenticato
if (sessionStorage.getItem('adminAuth') === 'true') {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    loadAdminEvents();
    loadAdminTasks();
    
    // Event listener per il tab task
    const taskTab = document.getElementById('tasks-admin-tab');
    if (taskTab) {
        taskTab.addEventListener('shown.bs.tab', function() {
            loadAdminTasks();
        });
    }
    
    // Gestione date nel modal di modifica
    const editStartDateInput = document.getElementById('editStartDate');
    const editEndDateInput = document.getElementById('editEndDate');
    
    if (editStartDateInput && editEndDateInput) {
        editStartDateInput.addEventListener('change', function() {
            if (this.value) {
                const startDate = new Date(this.value);
                const endDate = new Date(startDate.getTime() + 60 * 60 * 1000);
                editEndDateInput.value = endDate.toISOString().slice(0, 16);
                editEndDateInput.min = this.value;
            }
        });
    }
}

async function loadAdminEvents() {
    const response = await fetch('http://localhost:8001/events');
    const events = await response.json();
    const container = document.getElementById('admin-events-container');
    
    container.innerHTML = events.map(event => `
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">${event.title}</h5>
                    <p class="card-text">
                        <span class="badge bg-primary">${event.type}</span><br>
                        <small class="text-muted">
                            ${formatDate(event.start_date)} - ${formatDate(event.end_date)}
                        </small>
                    </p>
                    ${event.location ? `<p class="card-text"><i class="fas fa-map-marker-alt"></i> ${event.location}</p>` : ''}
                    <div class="btn-group" role="group">
                        <button class="btn btn-warning btn-sm" onclick="editEvent(${event.id})">✏️ Modifica</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteEvent(${event.id})">🗑️ Elimina</button>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

async function deleteEvent(eventId) {
    if (confirm('Sei sicuro di voler eliminare questo evento?')) {
        try {
            await fetch(`http://localhost:8001/events/${eventId}`, {
                method: 'DELETE'
            });
            loadAdminEvents();
            showAlert('Evento eliminato con successo!', 'success');
        } catch (error) {
            showAlert('Errore durante l\'eliminazione', 'danger');
        }
    }
}

async function editEvent(eventId) {
    try {
        // Carica i dati dell'evento
        const response = await fetch(`http://localhost:8001/events/${eventId}`);
        const event = await response.json();
        
        // Popola il modal di modifica
        document.getElementById('editEventId').value = event.id;
        document.getElementById('editTitle').value = event.title;
        document.getElementById('editDescription').value = event.description || '';
        document.getElementById('editType').value = event.type;
        document.getElementById('editLocation').value = event.location || '';
        
        // Formatta le date per datetime-local
        const startDate = new Date(event.start_date);
        const endDate = new Date(event.end_date);
        document.getElementById('editStartDate').value = startDate.toISOString().slice(0, 16);
        document.getElementById('editEndDate').value = endDate.toISOString().slice(0, 16);
        
        // Mostra il modal
        new bootstrap.Modal(document.getElementById('editEventModal')).show();
    } catch (error) {
        showAlert('Errore nel caricamento dell\'evento', 'danger');
    }
}

async function saveEditEvent() {
    const eventId = document.getElementById('editEventId').value;
    const formData = {
        title: document.getElementById('editTitle').value,
        description: document.getElementById('editDescription').value,
        type: document.getElementById('editType').value,
        location: document.getElementById('editLocation').value,
        start_date: document.getElementById('editStartDate').value,
        end_date: document.getElementById('editEndDate').value
    };
    
    console.log('Saving event:', eventId, formData);
    
    // Validazione date
    const startDate = new Date(formData.start_date);
    const endDate = new Date(formData.end_date);
    
    if (endDate <= startDate) {
        alert('La data di fine deve essere successiva alla data di inizio!');
        return;
    }
    
    try {
        const response = await fetch(`http://localhost:8001/events/${eventId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(formData)
        });
        
        console.log('Response status:', response.status);
        
        if (!response.ok) {
            const errorData = await response.text();
            console.error('Error response:', errorData);
            throw new Error(`HTTP ${response.status}`);
        }
        
        const result = await response.json();
        console.log('Update result:', result);
        
        bootstrap.Modal.getInstance(document.getElementById('editEventModal')).hide();
        loadAdminEvents();
        showAlert('Evento modificato con successo!', 'success');
    } catch (error) {
        console.error('Save error:', error);
        showAlert(`Errore durante la modifica: ${error.message}`, 'danger');
    }
}

function logout() {
    sessionStorage.removeItem('adminAuth');
    document.getElementById('login-section').style.display = 'block';
    document.getElementById('admin-panel').style.display = 'none';
    document.getElementById('adminPassword').value = '';
}

function formatDate(dateString) {
    return new Date(dateString).toLocaleDateString('it-IT', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

async function loadAdminTasks() {
    const response = await fetch('http://localhost:8001/tasks');
    const tasks = await response.json();
    const container = document.getElementById('admin-tasks-container');
    
    if (tasks.length === 0) {
        container.innerHTML = '<div class="alert alert-info">Nessun task presente</div>';
        return;
    }
    
    container.innerHTML = `
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Titolo</th>
                        <th>Priorità</th>
                        <th>Status</th>
                        <th>Scadenza</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody>
                    ${tasks.map(task => {
                        const priorityColor = task.priority === 'high' ? 'danger' : task.priority === 'medium' ? 'warning' : 'secondary';
                        const statusColor = task.status === 'completed' ? 'success' : task.status === 'in_progress' ? 'primary' : 'secondary';
                        
                        return `
                            <tr>
                                <td>
                                    <strong>${task.title}</strong>
                                    ${task.description ? `<br><small class="text-muted">${task.description}</small>` : ''}
                                </td>
                                <td><span class="badge bg-${priorityColor}">${task.priority}</span></td>
                                <td><span class="badge bg-${statusColor}">${task.status}</span></td>
                                <td>${task.due_date ? formatDate(task.due_date) : 'Non definita'}</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <button class="btn btn-warning btn-sm" onclick="editTask(${task.id})">✏️</button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">🗑️</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        </div>
    `;
}

async function deleteTask(taskId) {
    if (confirm('Sei sicuro di voler eliminare questo task?')) {
        try {
            await fetch(`http://localhost:8001/tasks/${taskId}`, {
                method: 'DELETE'
            });
            loadAdminTasks();
            showAlert('Task eliminato con successo!', 'success');
        } catch (error) {
            showAlert('Errore durante l\'eliminazione', 'danger');
        }
    }
}

async function editTask(taskId) {
    try {
        // Carica i dati del task
        const response = await fetch(`http://localhost:8001/tasks/${taskId}`);
        const task = await response.json();
        
        // Popola il modal di modifica
        document.getElementById('editTaskId').value = task.id;
        document.getElementById('editTaskTitle').value = task.title;
        document.getElementById('editTaskDescription').value = task.description || '';
        document.getElementById('editTaskPriority').value = task.priority;
        document.getElementById('editTaskStatus').value = task.status;
        
        // Formatta la data per datetime-local
        if (task.due_date) {
            const dueDate = new Date(task.due_date);
            document.getElementById('editTaskDueDate').value = dueDate.toISOString().slice(0, 16);
        }
        
        // Mostra il modal
        new bootstrap.Modal(document.getElementById('editTaskModal')).show();
    } catch (error) {
        showAlert('Errore nel caricamento del task', 'danger');
    }
}

async function saveEditTask() {
    const taskId = document.getElementById('editTaskId').value;
    const formData = {
        title: document.getElementById('editTaskTitle').value,
        description: document.getElementById('editTaskDescription').value,
        priority: document.getElementById('editTaskPriority').value,
        status: document.getElementById('editTaskStatus').value,
        due_date: document.getElementById('editTaskDueDate').value || null
    };
    
    try {
        const response = await fetch(`http://localhost:8001/tasks/${taskId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(formData)
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        bootstrap.Modal.getInstance(document.getElementById('editTaskModal')).hide();
        loadAdminTasks();
        showAlert('Task modificato con successo!', 'success');
    } catch (error) {
        showAlert(`Errore durante la modifica: ${error.message}`, 'danger');
    }
}

function showAlert(message, type) {
    const alert = document.createElement('div');
    alert.className = `alert alert-${type} alert-dismissible fade show`;
    alert.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    document.querySelector('main').prepend(alert);
    setTimeout(() => alert.remove(), 3000);
}
</script>
{% endblock %}
