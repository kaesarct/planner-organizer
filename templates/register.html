<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Scout Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card mt-5">
                    <div class="card-header text-center bg-scout-green text-white">
                        <h4>🏕️ Scout Planner</h4>
                        <p class="mb-0">Crea il tuo account</p>
                    </div>
                    <div class="card-body">
                        <form method="post" action="/auth/register">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nome completo</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-scout-green w-100">Registrati</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="/login" class="text-decoration-none">Hai già un account? Accedi</a>
                        </div>
                        <div id="error-message" class="alert alert-danger mt-3 d-none"></div>
                        <div id="success-message" class="alert alert-success mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Controlla se è il primo utente
        async function checkFirstUser() {
            try {
                const response = await fetch('/auth/check-first-user');
                const data = await response.json();
                if (data.is_first_user) {
                    document.querySelector('.card-header p').textContent = 'Crea il primo Admin';
                    document.getElementById('role-section').style.display = 'block';
                    document.getElementById('role').innerHTML = '<option value="admin">Admin (Primo Utente)</option>';
                }
            } catch (error) {
                console.log('Errore controllo primo utente');
            }
        }
        
        checkFirstUser();
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });
                
                if (response.ok) {
                    document.getElementById('success-message').textContent = 'Registrazione completata! Ora puoi accedere.';
                    document.getElementById('success-message').classList.remove('d-none');
                    document.getElementById('error-message').classList.add('d-none');
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    const error = await response.json();
                    document.getElementById('error-message').textContent = error.detail;
                    document.getElementById('error-message').classList.remove('d-none');
                }
            } catch (error) {
                document.getElementById('error-message').textContent = 'Errore di connessione';
                document.getElementById('error-message').classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
